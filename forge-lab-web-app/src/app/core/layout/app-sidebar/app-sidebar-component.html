<aside
    class="flex flex-col h-14 bg-sidebar border-r border-sidebar-border transition-all duration-200 ease-in-out shrink-0 overflow-hidden fixed inset-y-0 left-0 z-50 md:relative md:z-auto -translate-x-full md:translate-x-0" [ngClass]="{ ' w-[260px]': isSidebarOpen(), ' w-[60px]': !isSidebarOpen() }">
    <div class="flex items-center justify-between px-3 py-4 border-b border-sidebar-border">
        <div class="flex items-center gap-2.5 min-w-0">
            <img src="assets/logo.jpeg" alt="Logo" class="w-6 h-6">
            <div class="min-w-0">
                <p class="font-semibold text-sidebar-foreground text-sm tracking-tight leading-tight">Forge Lab</p>
                <p class="text-[10px] text-muted-foreground leading-tight">Knowledge System</p>
            </div>
        </div>
        <div class="flex items-center gap-0.5">
            <button
                class="hidden md:flex p-1.5 rounded-lg hover:bg-sidebar-accent text-muted-foreground hover:text-sidebar-foreground transition-colors" (click)="toggleSidebar()">
                <img src="assets/sidebar-icon.svg" alt="Sidebar Toggle" class="w-3 h-3" [ngClass]="{ 'rotate-180': !isSidebarOpen() }">
            </button>
        </div>
    </div>
</aside>
