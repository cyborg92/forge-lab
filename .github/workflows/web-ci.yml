name: CI

on:
  pull_request:
  push:
  
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  angular:
    name: Angular CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: forge-lab-web-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Angular project files
        run: |
          test -f package.json || {
            echo "::error::package.json not found"
            exit 1
          }

          test -f package-lock.json || {
            echo "::error::package-lock.json not found"
            exit 1
          }

          test -f angular.json || {
            echo "::error::angular.json not found"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build production application
        run: npm run build:prod
